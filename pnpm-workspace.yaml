# esbuild (vite), workerd (wrangler) and sharp (playwright image ops) ship native
# binaries and need their postinstall scripts to run. Without this, `pnpm install`
# exits non-zero and every `pnpm typecheck` / `pnpm build` fails before it starts.
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  sharp: true
  workerd: true
overrides:
  undici: 7.29.0
minimumReleaseAgeExclude:
  - miniflare@5.20260801.0-alpha
  - wrangler@4.119.0
